<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Nikhil Jai - AI Engineer, Agents, LLM Infrastructure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070910"/>
      <stop offset="0.5" stop-color="#0C111B"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(210 160) scale(340 300)">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(980 60) scale(420 360)">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="90" y1="160" x2="340" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rule" x1="430" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8FA0BF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="14" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>

  <!-- router graphic: one request fans out to three lanes -->
  <g fill="none" stroke="url(#wire)" stroke-width="1.75">
    <path id="lane1" d="M 108 160 C 200 160 210 80 322 80"/>
    <path id="lane2" d="M 108 160 L 322 160"/>
    <path id="lane3" d="M 108 160 C 200 160 210 240 322 240"/>
  </g>

  <g>
    <circle cx="90" cy="160" r="19" fill="#0B1120" stroke="#22D3EE" stroke-opacity="0.55"/>
    <circle cx="90" cy="160" r="6" fill="#22D3EE"/>
    <circle cx="90" cy="160" r="19" fill="none" stroke="#22D3EE" stroke-opacity="0.5">
      <animate attributeName="r" values="19;30;19" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#0B1120" stroke="#A78BFA" stroke-opacity="0.6">
    <circle cx="334" cy="80" r="11"/>
    <circle cx="334" cy="160" r="11"/>
    <circle cx="334" cy="240" r="11"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="334" cy="80" r="3.5"/>
    <circle cx="334" cy="160" r="3.5"/>
    <circle cx="334" cy="240" r="3.5"/>
  </g>

  <!-- packets in flight -->
  <circle r="3.2" fill="#67E8F9">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 108 160 C 200 160 210 80 322 80"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#67E8F9">
    <animateMotion dur="2.8s" begin="0.9s" repeatCount="indefinite" path="M 108 160 L 322 160"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" fill="#67E8F9">
    <animateMotion dur="2.8s" begin="1.8s" repeatCount="indefinite" path="M 108 160 C 200 160 210 240 322 240"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- type -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="432" y="92" font-size="14" letter-spacing="5.5" fill="#22D3EE" fill-opacity="0.9">ROUTE &#8594; BUILD &#8594; SHIP</text>
  </g>
  <text x="430" y="168" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="1.5" fill="#F1F5F9">NIKHIL JAI</text>
  <rect x="432" y="188" width="678" height="2" rx="1" fill="url(#rule)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="432" y="222" font-size="16.5" letter-spacing="3.2" fill="#C7D2E5">AI ENGINEER &#183; AGENTS &#183; LLM INFRASTRUCTURE</text>
    <text x="432" y="256" font-size="14.5" fill="#7C8CA8">$ AI Engineer Intern @ Intants &#8212; agents, gateways, and the infra beneath</text>
  </g>
</svg>
